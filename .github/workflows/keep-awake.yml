# A free Supabase project pauses after a week without use. This asks it for one row every three days,
# so the stats stay online between seasons. It only reads, with the public key the website uses.
name: Keep the database awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one season
        run: |
          curl -fsS --retry 3 --retry-delay 20 \
            "https://iwwmtturlbxebaiagscc.supabase.co/rest/v1/seasons?select=code&limit=1" \
            -H "apikey: sb_publishable_RVq88Qby-XtccIL-JUwWUw_w5OiMjzC"
